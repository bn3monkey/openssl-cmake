name: Build prebuilt OpenSSL

# Pushing a v* tag builds the static libraries for every platform and publishes
# them as GitHub Release assets.
#
# Archive layout:
#   include/openssl/*.h
#   lib/libcrypto.{a,lib}
#   lib/libssl.{a,lib}
#
# Running via workflow_dispatch skips the release and leaves only the artifacts.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:

  # =========================================================================
  # CMakeLists.txt is the single source of truth for the OpenSSL version.
  # Hardcoding 3.6.1 here would let it drift out of sync silently.
  # =========================================================================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      openssl_version: ${{ steps.v.outputs.openssl_version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version="$(sed -n 's/^set(OPENSSL_VERSION \([0-9.]*\)).*/\1/p' CMakeLists.txt)"
          if [[ -z "$version" ]]; then
            echo "could not parse OPENSSL_VERSION from CMakeLists.txt" >&2
            exit 1
          fi
          echo "openssl_version=$version" >> "$GITHUB_OUTPUT"
          echo "OpenSSL version: $version"

  # =========================================================================
  # Windows / MSVC  (x64 + arm64, each Debug + Release)
  #
  # MSVC is the only platform that needs two archives per arch: the CRT differs
  # (/MD for Release vs /MDd for Debug), so linking a Release library into a
  # Debug application produces LNK2038.
  #
  # x64 builds on windows-latest; arm64 builds natively on windows-11-arm
  # (GA GitHub-hosted runner, free for public repos). A native runner means
  # CMAKE_SYSTEM_PROCESSOR is genuinely ARM64, so detectTargetArchitecture()
  # resolves to arm64 without any cross-compile CMAKE_SYSTEM_NAME juggling.
  # =========================================================================
  windows-msvc:
    runs-on: ${{ matrix.runner }}
    needs: prepare
    env:
      OPENSSL_VERSION: ${{ needs.prepare.outputs.openssl_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64,   config: Release, runner: windows-latest, msvc_arch: x64 }
          - { arch: x64,   config: Debug,   runner: windows-latest, msvc_arch: x64 }
          - { arch: arm64, config: Release, runner: windows-11-arm, msvc_arch: arm64 }
          - { arch: arm64, config: Debug,   runner: windows-11-arm, msvc_arch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      # Use Ninja (single-config) together with CMAKE_BUILD_TYPE.
      # Visual Studio generators are multi-config and leave CMAKE_BUILD_TYPE
      # empty, which would always resolve OpenSSL's --debug check to Release.
      - name: Configure and build
        shell: cmd
        run: |
          cmake -S . -B build -G Ninja ^
            -DOPENSSL_CMAKE_USE_PREBUILT=OFF ^
            -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          cmake --build build

      - name: Package
        shell: bash
        run: |
          ./.github/scripts/package.sh \
            --triple "windows-${{ matrix.arch }}-msvc-$(echo ${{ matrix.config }} | tr '[:upper:]' '[:lower:]')" \
            --build-dir build \
            --lib-ext lib

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}-msvc-${{ matrix.config }}
          path: dist/*.tar.gz

  # =========================================================================
  # Windows / MinGW x64
  #
  # The MSYS2 MINGW64 environment is msvcrt based.
  # Its CRT has to match Qt's bundled MinGW (e.g. Qt 5.15.2 / MinGW 8.1, msvcrt)
  # for the libraries to link. Building in UCRT64 instead would break linking
  # for msvcrt-based consumers.
  # =========================================================================
  windows-mingw:
    runs-on: windows-latest
    needs: prepare
    env:
      OPENSSL_VERSION: ${{ needs.prepare.outputs.openssl_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 (MINGW64 / msvcrt)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-ninja

      # Configure with the native Windows cmake but point it at the MINGW64
      # compilers. (The "MinGW Makefiles" generator refuses to run when sh.exe
      # is on PATH, so use Ninja.)
      - name: Configure and build
        shell: pwsh
        run: |
          $mingw = "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin"
          if (-not (Test-Path $mingw)) { $mingw = "C:\msys64\mingw64\bin" }
          $env:PATH = "$mingw;$env:PATH"
          cmake -S . -B build -G Ninja `
            -DOPENSSL_CMAKE_USE_PREBUILT=OFF `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER="$mingw\gcc.exe" `
            -DCMAKE_CXX_COMPILER="$mingw\g++.exe"
          cmake --build build

      - name: Package
        shell: bash
        run: |
          ./.github/scripts/package.sh \
            --triple windows-x64-mingw-release \
            --build-dir build \
            --lib-ext a

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-mingw-release
          path: dist/*.tar.gz

  # =========================================================================
  # Linux (x64 + arm64)
  #
  # Built INSIDE the manylinux2014 container (CentOS 7 / glibc 2.17), NOT on the
  # bare ubuntu-latest runner. ubuntu-latest ships glibc >= 2.38, whose headers
  # redirect strtol() & friends to __isoc23_strtol@GLIBC_2.38. A static archive
  # built there fails to link on older toolchains (e.g. gcc-toolset-11 on
  # RHEL8/glibc 2.28) with "undefined reference to __isoc23_strtol". Building
  # against glibc 2.17 keeps the references at plain strtol, so the archive links
  # on virtually any modern Linux.
  #
  # arm64 runs on the native ubuntu-24.04-arm runner (GA, free for public repos),
  # which executes the aarch64 container without QEMU.
  #
  # We drive the container with `docker run` (rather than a job-level `container:`)
  # so that actions/checkout runs on the host — checkout@v4 uses Node 20, which
  # needs glibc >= 2.28 and would not run inside the glibc-2.17 image.
  # =========================================================================
  linux:
    runs-on: ${{ matrix.runner }}
    needs: prepare
    env:
      OPENSSL_VERSION: ${{ needs.prepare.outputs.openssl_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { triple: linux-x64-release,   runner: ubuntu-latest,   image: quay.io/pypa/manylinux2014_x86_64 }
          - { triple: linux-arm64-release, runner: ubuntu-24.04-arm, image: quay.io/pypa/manylinux2014_aarch64 }
    steps:
      - uses: actions/checkout@v4

      # devtoolset gcc (glibc 2.17 target) is already on the image's PATH.
      # We only need perl's IPC::Cmd (OpenSSL Configure requires it), make, and a
      # recent CMake (pulled from a bundled CPython).
      - name: Build in manylinux2014 (glibc 2.17)
        run: |
          docker run --rm -v "$PWD":/work -w /work "${{ matrix.image }}" bash -euo pipefail -c '
            yum install -y perl-IPC-Cmd perl-Data-Dumper make >/dev/null
            export PATH="/opt/python/cp311-cp311/bin:$PATH"
            pip install --quiet cmake
            cmake -S . -B build \
              -DOPENSSL_CMAKE_USE_PREBUILT=OFF \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build build
          '

      - name: Package
        run: |
          ./.github/scripts/package.sh \
            --triple ${{ matrix.triple }} \
            --build-dir build \
            --lib-ext a

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.triple }}
          path: dist/*.tar.gz

  # =========================================================================
  # Android (arm64-v8a, x86_64)
  #
  # Built at API 21, so any app with minSdk 21 or above can use it.
  # (A library built for a lower API works on higher ones, not the other way.)
  #
  # 16 KB page alignment is not a property of the .a itself — it is decided when
  # the final .so is linked. The IMPORTED target in CMakeLists propagates
  # -Wl,-z,max-page-size=16384 to consumers, so no extra flag is needed here.
  # =========================================================================
  android:
    runs-on: ubuntu-latest
    needs: prepare
    env:
      OPENSSL_VERSION: ${{ needs.prepare.outputs.openssl_version }}
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Configure and build
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cmake -S . -B build \
            -DOPENSSL_CMAKE_USE_PREBUILT=OFF \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Package
        run: |
          ./.github/scripts/package.sh \
            --triple android-${{ matrix.abi }}-release \
            --build-dir build \
            --lib-ext a

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.abi }}-release
          path: dist/*.tar.gz

  # =========================================================================
  # Generate the manifest and publish the release
  #
  # The SHA256 hashes are shipped as a release asset rather than committed to
  # the repo, which avoids the chicken-and-egg problem of needing the tag to
  # exist before the build that produces the hashes can run.
  # =========================================================================
  publish:
    needs: [prepare, windows-msvc, windows-mingw, linux, android]
    runs-on: ubuntu-latest
    env:
      OPENSSL_VERSION: ${{ needs.prepare.outputs.openssl_version }}
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate manifest
        run: ./.github/scripts/generate_manifest.sh artifacts "$OPENSSL_VERSION"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/prebuilt-manifest.cmake
          generate_release_notes: true
